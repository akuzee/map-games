name: Deploy to GitHub Pages

# Data packs aren't in git (see DECISIONS.md §3) — this pulls the prebuilt
# library from the latest data release before publishing, so the live site
# always ships the same packs `tools/fetch-packs.mjs` would give you locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch prebuilt quiz packs
        run: node tools/fetch-packs.mjs

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html css js data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
